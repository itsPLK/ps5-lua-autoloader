name: Dev Build and Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Package
        id: build_package
        run: ./build.sh --dev --download-deps

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(make print-version BUILD_TYPE=dev)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          LAST_STABLE_TAG=$(git tag --sort=-creatordate | grep -v "\-dev\-" | grep -v "^${VERSION}$" | head -n 1)
          echo "last_stable_tag=${LAST_STABLE_TAG}" >> $GITHUB_OUTPUT

      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.get_version.outputs.version }}
          prerelease: true
          body: |
            - ### Changelog:

            **Full Changelog (since last stable release)**: https://github.com/itsPLK/ps5-lua-autoloader/compare/${{ steps.get_version.outputs.last_stable_tag }}...${{ steps.get_version.outputs.version }}

            ---
            <details>
            <summary>Bundled Binaries</summary>

            This build integrates the following external dependency versions:
            - [itsPLK/ps5-elfldr](https://github.com/itsPLK/ps5-elfldr): [${{ steps.build_package.outputs.elfldr_ver }}](https://github.com/itsPLK/ps5-elfldr/releases/tag/${{ steps.build_package.outputs.elfldr_ver }})
            - [itsPLK/ps5-kexp](https://github.com/itsPLK/ps5-kexp): [${{ steps.build_package.outputs.kexp_ver }}](https://github.com/itsPLK/ps5-kexp/releases/tag/${{ steps.build_package.outputs.kexp_ver }})
            - [itsPLK/ps5-payload-manager](https://github.com/itsPLK/ps5-payload-manager): [${{ steps.build_package.outputs.pldmgr_ver }}](https://github.com/itsPLK/ps5-payload-manager/releases/tag/${{ steps.build_package.outputs.pldmgr_ver }})

            </details>
          files: 'ps5-lua-autoloader-*.zip'
